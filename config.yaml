    items:
      - job: "Applied AI Engineer | Data Science Intern"
        company: "CloudLeap Technologies"
        companyUrl: "https://cloudleaptech.com"
        date: "Jul 2024 - Present"
        featuredLink:
          enable: false
          name: "View the project"
          url: "https://example.com"
        info:
          enable: true
          content: 'Duration: 11 months (Ongoing)'
        content: |
          CloudLeap Technologies, LLC is a software development and consulting firm that specializes in providing innovative solutions in Big Data, AI, Machine Learning, and NLP. The company helps clients securely manage and analyze data using advanced cloud-based tools and open-source technologies​.

          - Led development of an Agentic RAG AI chatbot for the precisionFDA Challenge 2025, implementing autonomous retrieval of FDA documents via LlamaIndex, and delivering real-time, context-aware responses.
          - Implemented a summarization PoC using PyMuPDF, HuggingFace Transformers, NLTK, scikit-learn, and LangChain to automate FDA workshop summaries, reducing generation time from 4 days to 4 hours per workshop
          - Spearheaded machine translation of policy documents under The Opportunity Project, converting materials into five languages using Pretrained LLMs and storage on GCP, broadening access for Indigenous communities.

      - job: "AI/ML Student Software Engineer"
        company: "DIT (UMCP)"
        companyUrl: "https://it.umd.edu/"
        date: "Jul 2024 - Dec 2024"
        featuredLink:
          enable: false
          name: "View the project"
          url: "https://example.com"
        info:
          enable: true
          content: 'Duration: 6 months'
        content: |
          The Division of Information Technology at the University of Maryland, College Park, is responsible for supporting and advancing the university’s technology infrastructure. It plays a critical role in enhancing academic, research, and administrative functions through innovative IT solutions.

          - Collaborated with the Enterprise Software Engineering Team to design and deploy RAG-powered chatbots (LangChain, AWS S3, AWS ECS), supporting 500+ daily student queries across 12 courses.
          - Built a context-aware weekly questions suggestion feature tailored for academic chatbots, increasing user-initiated interactions by 20% and establishing the tool as a critical resource for student support services.
          - Enhanced chatbot ingestion by integrating image extraction and GPT-4o-Mini captioning, improving visual-content response accuracy by 35%.

      - job: "Project Associate"
        company: "IIT Madras"
        companyUrl: "https://www.kaatru.org/"
        date: "Jun 2022 - Jul 2023"
        featuredLink:
          enable: false
          url: "https://example.com"
        info:
          enable: true
          content: 'Duration: 13 Months'
        content: |
          Project Kaatru is intended to provide real time Air Quality information using a network of distributed IoT devices, remotely sensed spatiotemporal data and theoretical models.

          - Spearheaded comprehensive IoT device development for air pollution monitoring, integrating 2 additional features, and reducing development time by 2 months through establishing robust systems, and streamlined processes.
          - Actively collaborated with the software development team to enable seamless integration of IoT data into backend cloud services.
          - Recognized for outstanding contributions and was chosen to represent the team and the IoT device at the Eco Expo startup exhibition in Chennai.

      - job: "Co-Founder and Embedded Firmware Engineer"
        company: "Pegasus Automation"
        companyUrl: "http://www.linkedin.com/company/pegasus-automation"
        date: "Jan 2020 - Jun 2022"
        info:
          enable: false
        featuredLink:
          enable: false
          url: "http://www.linkedin.com/company/pegasus-automation"
        info:
          enable: true
          content: 'Duration: 30 Months'
        content: |
          Pegasus is an innovative home automation product that strives to revolutionize the way humans interact with their homes and care about their loved ones.

          - Led the firmware team in C and C++ programming for embedded systems, ensuring efficient and reliable device performance consequently gaining problem-solving skills.
          - Learned Cloud Infrastructure Management and deployment of new features on AWS services like AWS Lambda, AWS IoT Core, Dynamo DB, and API Gateway.
          - Secured cumulative funding of 1M INR (Indian Currency) through successful investor pitches, and grant applications ensuring sustainable growth and development.

