  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I completed my Master’s in Data Science from the University of Maryland, College Park (CGPA: 3.97/4.00). I have a strong interest in Entrepreneurship employing technology to solve major problems. I recently wrapped up my tenure as an AI/ML student software engineer at [Department of Information Technology (DIT)](https://it.umd.edu/), University of Maryland. I served as a Data Science Intern at [CloudLeap Technologies, LLC](https://cloudleaptech.com) until May 2025, and I am now working part-time as an Applied AI Engineer at CloudLeap.

      Beyond data science, I find fulfillment in exploring spiritual teachings, hiking scenic trails for adventure, cheering on cricket matches with enthusiasm, and actively seeking opportunities to contribute and support others in meaningful ways. Lately, I’ve also developed a passion for learning Astrology and gaining deeper insights into how the Universe works.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "LlamaIndex"
        - "Deep Learning"
        - "HybridRAG"
        - "PyTorch"
        - "MCP/A2A"
        - "Fine-tuning LLM"

  # Experience
